services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      BIOTRUST_EXECUTION_TIMEOUT_SECONDS: "900"
      BIOTRUST_MAX_UPLOAD_MB: "50"
      BIOTRUST_MAX_FEATURES: "50000"
      BIOTRUST_MAX_SAMPLES: "500"
    read_only: true
    tmpfs:
      - /tmp:size=1G,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
